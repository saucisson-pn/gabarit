name: continuous-integration

on:
  push:
    branches: [main, daily]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Root inventory (allowed-root.txt, ADR-0012)
        run: |
          git ls-files | cut -d/ -f1 | sort -u > "$RUNNER_TEMP/actual-root.txt"
          grep -v '^#' allowed-root.txt | grep -v '^[[:space:]]*$' | sort -u \
            > "$RUNNER_TEMP/allowed-root.txt"
          unknown=$(comm -23 "$RUNNER_TEMP/actual-root.txt" "$RUNNER_TEMP/allowed-root.txt")
          if [ -n "$unknown" ]; then
            echo "Unknown top-level entries (add to allowed-root.txt or remove them):"
            echo "$unknown"
            exit 1
          fi

      - name: Node gate flavor syntax check (ADR-0012)
        run: node --check tools/gates/react/n2_license.mjs

      - name: Install uv and pin Python 3.15
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: english-only front
        run: uv run python -m scripts english-only

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy tools/notify/src tools/notify/tests scripts

      - name: import-linter onion contract
        run: uv run lint-imports

      - name: pytest with coverage floor
        run: uv run pytest

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        # gitleaks-action demands a paid license on organizations while
        # the scanner itself is MIT: run the pinned upstream release
        # instead, checksum-verified against the release checksums
        # asset (same scanner, same rules, no license dependency).
        run: |
          version=8.30.1
          checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "${checksum}  ${RUNNER_TEMP}/$archive" \
            | sha256sum --check --strict -
          tar --extract --gunzip --file "$RUNNER_TEMP/$archive" \
            --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: pip-audit of the locked graph
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file requirements.txt
          uvx pip-audit --requirement requirements.txt --strict


      - name: Sync the locked environment
        run: uv sync --locked

      - name: License gate of the locked graph
        run: uv run python -m scripts license-gate
