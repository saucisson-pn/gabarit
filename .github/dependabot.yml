# Dependabot configuration (ADR-0013): scheduled, grouped dependency
# maintenance, native to GitHub - no platform app, no account.
# Agents never bump dependencies themselves - this bot owns that job.
version: 2

updates:
  # The Python graph: uv.lock is the committed source of truth
  # (ADR-0001). Version updates target daily (ADR-0005).
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "daily"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"

  # The CI supply chain: action references in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "daily"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "
    groups:
      non-major:
        update-types:
          - "minor"
          - "patch"
